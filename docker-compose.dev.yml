version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8080"
    environment:
      - PORT=8080
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload

  client:
    image: node:18
    working_dir: /app
    volumes:
      - ./client:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
