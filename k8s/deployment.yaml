apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-assistant-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: personal-assistant-agent
  template:
    metadata:
      labels:
        app: personal-assistant-agent
    spec:
      containers:
        - name: personal-assistant-agent
          image: gcr.io/PROJECT_ID/personal-assistant-agent:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
